services:
  printpasa:
    build: .
    container_name: printpasa
    ports:
      - "3001:3000"
    volumes:
      # Persist the SQLite database across container restarts
      - ./data:/app/data
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # SQLite on the mounted ./data volume by default. Override in .env with a
      # remote Turso URL if desired. Path must live under /app/data to persist.
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:/app/data/db/printpasa.db}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional fully-local, S3-compatible image storage (no AWS/R2 account needed).
  # Enable with:  docker compose --profile local-storage up --build
  # Then in .env set:
  #   NUXT_S3_ENDPOINT=http://minio:9000
  #   NUXT_S3_ACCESS_KEY_ID=minioadmin
  #   NUXT_S3_SECRET_ACCESS_KEY=minioadmin
  #   NUXT_S3_BUCKET=printpasa
  #   NUXT_S3_REGION=us-east-1
  # Create the bucket once at http://localhost:9001 (console) or via mc.
  minio:
    image: minio/minio:latest
    container_name: printpasa-minio
    profiles: ["local-storage"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
